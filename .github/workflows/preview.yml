name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

env:
  PREVIEW_SEGMENT: _previews

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - if: github.event.action != 'closed'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - if: github.event.action != 'closed'
        run: npm ci

      - if: github.event.action != 'closed'
        run: npm run build
        env:
          PR_NUMBER: ${{ github.event.number }}

      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        id: preview
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: ${{ env.PREVIEW_SEGMENT }}
          pages-base-url: bojan.link
          qr-code: false
          comment: false

      - if: steps.preview.outputs.deployment-action == 'deploy'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-preview
          message: |
            Preview: ${{ steps.preview.outputs.preview-url }}

            Built from `${{ github.sha }}` at ${{ steps.preview.outputs.action-start-time }}.

      - if: steps.preview.outputs.deployment-action == 'remove'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-preview
          message: |
            Preview removed because the pull request was closed.
