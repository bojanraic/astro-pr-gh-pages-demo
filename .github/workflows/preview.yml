name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

env:
  PREVIEW_SEGMENT: _previews

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: github.event.action != 'closed'
        run: npm ci

      - if: github.event.action != 'closed'
        run: npm run build
        env:
          PR_NUMBER: ${{ github.event.number }}

      - uses: rossjrw/pr-preview-action@v1
        id: preview
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: ${{ env.PREVIEW_SEGMENT }}
          qr-code: false
          comment: false

      - if: steps.preview.outputs.deployment-action == 'deploy'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            Preview: ${{ steps.preview.outputs.preview-url }}

            Built from `${{ github.sha }}` at ${{ steps.preview.outputs.action-start-time }}.

      - if: steps.preview.outputs.deployment-action == 'remove'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            Preview removed because the pull request was closed.
